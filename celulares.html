<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex - Smartphones</title>
 <style>
    body {
        background: linear-gradient(to right, #000000, #333333, #000000);
    }
    .containerfooter {
        position: sticky;
        padding: 20px;
        top: 0;
        display: flex;
        width: 90%;
        height: 25px;
        background-color: rgb(39, 33, 33);
        justify-content: center;
        align-items: center;
        border: 2px solid #22D3EE;
        border-radius: 10px;
        margin: 0 auto;
        box-shadow: 0 0 10px #00eaff;

    }
    .containerfooter h1 {
        color: #8be5f3;
        font-size: 15px;
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif, sans-serif;
    }
    .container {
        position: sticky;
        padding: 20px;
        top: 0;
        display: flex;
        width: 90%;
        background-color: rgb(39, 33, 33);
        justify-content: center;
        align-items: center;
        border: 2px solid #22D3EE;
        border-radius: 10px;
        margin: 0 auto;
        box-shadow: 0 0 10px #00eaff;

    }
    .container h1 {
        color: #8be5f3;
        font-size: 48px;
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif, sans-serif;
    }
     .card{
        text-align: center;
        display: inline-block;
        background-color: rgb(39, 33, 33);
        border: 2px solid #22D3EE;
        border-radius: 10px;
        justify-content: center;
        align-items: center;
        padding: 20px;
        margin: 20px;
        box-shadow: 0 0 10px #00eaff;
        transition: 0.3s;
        width:calc(19% - 15px);
    }
    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 0 10px #00eaff;
        box-shadow: 0 0 20px #00eaff;
        box-shadow: 0 0 40px #00eaff;
        border-color: #00ffff;
    }
    .card h2{
        color: #8be5f3;
        font-size: 20px;
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif, sans-serif;
    }
    .card hr {
        margin: 10px 0;
        color: #22D3EE;
        box-shadow: 0 0 5px #00eaff;
    }
    a {
        text-decoration: none;
    }
    img {
        display: block;
        margin: 0 auto 10px;
    }
    .logo {
        display:flex;
        align-items: center;
        gap: 5px;

    }
    .logo img {
        width: 48px;
        height: 45px;
    }
    .logoft {
        display:flex;
        align-items: center;
        gap: 5px;

    }
    .logoft img {
        width: 15px;
        height: 20px;
    }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo">V<img src="https://cdn-icons-png.freepik.com/512/10201/10201535.png">rtex Celulares</h1>
    </div>

        <img src="https://m.media-amazon.com/images/G/32/apple/iPhone/iPhone17Pro/AMZ_Family-Stripe_iPhone_17_pro_max._CB800727195_.png" width="150" height="135">
        <hr>
        <h2>iPhone 17 Pro Max</h2>
        <h2>R$ 12.990,00</h2>
    </div>

    <div class="card">
        <img src="https://www.mozillion.com/storage/product_model_images/1772098843_samsung-galaxy-s26-ultra-black-back-front.png" width="150" height="135">
        <hr>
        <h2>Samsung Galaxy S26 Ultra</h2>
        <h2>R$ 15.990,00</h2>
    </div>

     <div class="card">
        <img src="https://files.tecnoblog.net/wp-content/uploads/2025/10/xiaomi-17-pro-max-violeta.png" width="150" height="135">
        <hr>
        <h2>Xiaomi 17 Pro Max</h2>
        <h2>R$ 8.990,00</h2>
    </div>

     <div class="card">
        <img src="https://files.tecnoblog.net/wp-content/uploads/2025/11/zte-nubia-redmagic-11-pro-subzero.png" width="150" height="135">
        <hr>
        <h2>Red Magic 11 Pro Subzero</h2>
        <h2>R$ 6.990,00</h2>
    </div>
</body>
<footer>
    <div class="containerfooter">
        <h1 class="logoft">© 2026 V<img  src="https://cdn-icons-png.freepik.com/512/10201/10201535.png">rtex Smartphones. Todos os direitos reservados.</h1>
    </div>
</footer>
</html>
