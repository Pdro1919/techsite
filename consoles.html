    .container {
        position: sticky;

    }
     .card{
        text-align: center;
        display: inline-block;
        background-color: rgb(39, 33, 33);
        border: 2px solid #22D3EE;
        border-radius: 10px;
        justify-content: center;
        align-items: center;
        padding: 20px;
        margin: 20px;
        box-shadow: 0 0 10px #00eaff;
        transition: 0.3s;
        width:calc(19% - 15px);
    }
    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 0 10px #00eaff;
        box-shadow: 0 0 20px #00eaff;
        box-shadow: 0 0 40px #00eaff;
        border-color: #00ffff;
    }
    .card h2{
        color: #8be5f3;
        font-size: 20px;
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif, sans-serif;
    }
    .card hr {
        margin: 10px 0;
        color: #22D3EE;
        box-shadow: 0 0 5px #00eaff;
    }
    a {
        text-decoration: none;
    }
    img {
        display: block;
        margin: 0 auto 10px;
    }
    .logo {
        display:flex;
        align-items: center;
        gap: 5px;

    }
    .logo img {
        width: 48px;
        height: 45px;
    }
    .logoft {
        display:flex;
        align-items: center;
        gap: 5px;

    }
    .logoft img {
        width: 15px;
        height: 20px;
    }
